[project]
name = "enterprisex"
version = "0.1.0"
description = "Financial invoice audit core"
readme = "README.md"
authors = [
    { name = "Abhijeet Raj", email = "abhiraj84452@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "enterprise_x"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
